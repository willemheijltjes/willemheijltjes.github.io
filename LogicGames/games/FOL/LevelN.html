<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/2.0.0/jquery.min.js" type="text/javascript"></script>


    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">

    <!-- Optional theme-->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPlumb/2.2.9/jsplumb.js"></script>


    <link rel="stylesheet" type="text/css" href="Levels.css" media="screen">
    <link rel="stylesheet" type="text/css" href="2Item.css" media="screen">

    <title>Level n</title>
    <script src="FOL.js" type="text/javascript"></script>
    <script src="old/parser.js" type="text/javascript"></script>

    <script src="LevelN.js" type="text/javascript"></script>

</head>

<div class="modal fade" id="instructionModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel">Instructions</h4>
            </div>
            <div class="modal-body">
                <p>In this level, you're ready to try writing your own sentences.</p>
                <p>The scene is fixed - try to describe it by typing a sentence into the box on the right.</p>
                <p></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal">Got it!</button>
            </div>
        </div>
    </div>
</div>
<body >
<div class = "container-fluid">
    <div class="row">
        <div class="col-md-12">
            <h1>Try your own sentences</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-md-9 holder">
            <div class="box receiverBox" id="russellEmotion" data-toggle="tooltip" data-placement="left" title="Russell's emotion">
                <img src="images/smiley.png"  id="Happy" width="88" height="31" data-toggle="tooltip" data-placement="bottom" title="Happy()">

            </div>
            <img src="images/russell.png" id="russell" width="250" height="300">
            <div class="arrowBox startArrowBox topArrowBox" draggable="true" ondragstart="drag(event)" id="topArrow" width="500" height="100" >
                <table>
                    <tr>
                        <td>
                            <div class="partArrow">
                                <img src="images/leftTopArrow.png" height="90" width="100" >
                            </div>
                        </td>
                        <td>
                            <div class="box1 receiverBox" id="russellFrege" ondrop="dropB(event)" ondragover="allowDrop(event)" data-toggle="tooltip" data-placement="top" title="Russell's feelings towards Frege">
								<img src="images/lightning.png"  id="IsAngryWith" width="88" height="31" data-toggle="tooltip" data-placement="bottom" title="IsAngryWith()">

							</div>

                        </td>
                        <td>
                            <div class="partArrow">
                                <img src="images/rightTopArrow.png" height="90" width="100" >
                            </div>
                        </td>
                    </tr>

                </table>

            </div>
			<div class="arrowBox startArrowBox bottomArrowBox" draggable="true" ondragstart="drag(event)" id="bottomArrow" width="500" height="100" >
                <table>
                    <tr>
                        <td>
                            <div class="partArrow">
                                <img src="images/leftBottomArrow.png" height="90" width="100" >
                            </div>
                        </td>
                        <td>
                            <div class="box1 receiverBox" id="fregeRussell" ondrop="dropB(event)" ondragover="allowDrop(event)" data-toggle="tooltip" data-placement="top" title="Frege's feelings towards Russell">
								<img src="images/heart.png"  id="Likes" width="88" height="31" data-toggle="tooltip" data-placement="bottom" title="Likes()">
							
							</div>

                        </td>
                        <td>
                            <div class="partArrow">
                                <img src="images/rightBottomArrow.png" height="90" width="100" >
                            </div>
                        </td>
                    </tr>

                </table>

            </div>

            <img src="images/frege.png" id="frege" width="250" height="400">
            <div class="box receiverBox" id="fregeEmotion" data-toggle="tooltip" data-placement="right" title="Frege's emotion">
                <img src="images/theory.png" id="HasTheory" width="88" height="31" data-toggle="tooltip" data-placement="bottom" title="HasTheory()">

            </div>

        </div>
        <div class="col-md-3">
            <div class="sentences">
                <div class="row">
                    <div class="col-md-12">
                <input type="text" id="userInput"></input>
                    </div>
                </div>
                <div class="row" style="padding-top:10px">
                    <div class="col-md-12">
                        <!--html entity codes for special chars-->
                        <button class="btn btn-default"   onclick="addCharacter(forall)">&#8704</button>
                        <button class="btn btn-default"  onclick="addCharacter(thereExists)">&#8707</button>
                        <button class="btn btn-default"  onclick="addCharacter(conjunction)">&#8743</button>
                        <button class="btn btn-default" onclick="addCharacter(disjunction)">&#8744</button>
                        <button class="btn btn-default"  onclick="addCharacter(negation)">&#172</button>
                    </div>

                </div>
                <div class="row" style="padding-top:10px" >
                    <div class="col-md-12">
                        <button class="btn btn-success" id="clickMe" onclick="forParserPrinting()">Check</button>
                    </div>
                </div>
                <div class="row" style="padding-top:10px" >
                    <div class="col-md-12">
                        <button type="button" class="btn btn-info" data-toggle="modal" data-target="#instructionModal">
                            View the instructions again
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-9">

            <button class="btn btn-primary" id="clickMe1" onclick="forPrinting()">Click me.</button>
        </div>
        <div class="col-md-3">
            <p id="compOutput"></p>
            <p id="compOutput2"></p>
            <p id="compOutput3"></p>


        </div>
    </div>

</div>
</body>
</html>
